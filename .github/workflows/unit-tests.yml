name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Vitest
        run: npx vitest run --reporter=default --reporter=json --outputFile=test-results/vitest.json

      - name: Summarize results
        if: always()
        run: |
          if [ -f test-results/vitest.json ]; then
            jq -r '"### Unit tests\n\(.numPassedTests) passed, \(.numFailedTests) failed, \(.numPendingTests) skipped (of \(.numTotalTests))"' test-results/vitest.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Unit tests: no results file" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
