name: Release

# Pushing a tag like v0.1.0 builds the DMG and zip and publishes a GitHub
# release with generated notes. Make the tag with `npm run release -- <version>`.
#
# Signed and notarized builds (later). Add these repository secrets, set
# `mac.identity` and `mac.notarize: true` in electron-builder.yml, and drop
# CSC_IDENTITY_AUTO_DISCOVERY below:
#   CSC_LINK                      base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD              its password
#   APPLE_ID                      the Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD   an app-specific password for that Apple ID
#   APPLE_TEAM_ID                 the developer team id
# and pass them to the "Build" step's env.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      - run: npm run verify

      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # gh instead of a third-party release action: only GitHub-official actions are used here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag release/*.dmg release/*.zip
